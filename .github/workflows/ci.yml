name: CI

# Build and test every pull request. `synchronize` fires on every push to the PR branch.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the engines floor declared in package.json; 22 is the version used for publishing.
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + emit dist)
        run: npm run build

      - name: Test
        run: npm test

      - name: Type-check examples against the SDK source
        run: npx tsc -p examples/tsconfig.json
